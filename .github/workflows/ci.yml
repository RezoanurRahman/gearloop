name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Start server and verify health endpoint
        run: |
          set -euo pipefail
          npm start > /tmp/gearloop-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -f "tsx src/server.ts" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/api/health \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 attempts." >&2
          tail -n 50 /tmp/gearloop-server.log >&2 || true
          exit 1
